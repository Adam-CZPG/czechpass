name: CI

# Har bir push va pull request'da: tekshiruv → testlar → xavfsizlik → Playwright → APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  analyze-and-test:
    name: Analyze va unit testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Savollar fayllari tuzilmasi va yozish namunalarini tekshirish (tool/content → assets/questions).
      - name: Kontent tekshiruvi
        run: |
          python3 tool/build_realie.py
          python3 tool/build_a2.py
          git diff --exit-code assets/questions
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  security:
    name: Xavfsizlik tekshiruvlari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git tarixi ham tekshiriladi
      # Butun git tarixini tekshiramiz (gitleaks-action birinchi push'da diapazonni noto'g'ri hisoblaydi).
      - name: Maxfiy kalitlarni qidirish (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh zricethezav/gitleaks:latest -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --no-banner --redact --verbose'
      - name: Paketlardagi zaifliklar (OSV-Scanner)
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest scan source -r /src
      - name: Android va kod qoidalari
        run: bash tool/security_check.sh

  e2e-web:
    name: Playwright (Flutter web)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright o'rnatish
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright testlari
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  build-android:
    name: APK yig'ish
    needs: [analyze-and-test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # Gradle paketlari keshlanadi: Maven serveri vaqtincha javob bermasa ham yig'ish ishlaydi.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Hozircha sinov kaliti bilan imzolanadi. Google Play uchun keyin o'z kalitimiz
      # GitHub Secrets orqali qo'shiladi va AAB yig'iladi.
      # Ikki variant: "full" — sinov uchun barcha bo'limlar ochiq (DEV_UNLOCK), "free" — foydalanuvchi ko'radigan bepul versiya.
      # Imzo kaliti GitHub Secrets'dan vaqtinchalik faylga yoziladi (repoga tushmaydi).
      - name: Imzo kaliti
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Doimiy kalit bilan imzolanadi"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yo'q — APK debug kaliti bilan imzolanadi (yangilanishda ma'lumotlar saqlanmaydi)"
          fi
      - name: APK (full, sinov uchun)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Har bir yig'ish raqami oldingisidan katta: yangi APK eskisining ustidan o'rnatiladi.
          # Gradle ba'zan paketlarni yuklashda tarmoq xatosi beradi — 3 martagacha qayta urinamiz.
          for i in 1 2 3; do
            flutter build apk --release --dart-define=DEV_UNLOCK=true --build-number=${{ github.run_number }} && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::APK yig'ish muvaffaqiyatsiz ($i), qayta urinilmoqda"; sleep 30
          done
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/czechpass-full.apk
      - name: APK (free)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for i in 1 2 3; do
            flutter build apk --release --build-number=${{ github.run_number }} && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::APK yig'ish muvaffaqiyatsiz ($i), qayta urinilmoqda"; sleep 30
          done
          cp build/app/outputs/flutter-apk/app-release.apk dist/czechpass-free.apk
      # Google Play faqat AAB qabul qiladi. Bepul versiya bilan bir xil kod, to'lov Play orqali ochiladi.
      - name: AAB (Google Play uchun)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for i in 1 2 3; do
            flutter build appbundle --release --build-number=${{ github.run_number }} && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::AAB yig'ish muvaffaqiyatsiz ($i), qayta urinilmoqda"; sleep 30
          done
          cp build/app/outputs/bundle/release/app-release.aab dist/czechpass.aab
      - uses: actions/upload-artifact@v7
        with:
          name: czechpass-apk
          path: |
            dist/*.apk
            dist/*.aab
          retention-days: 14
